# CI/CD: cada job roda só quando o que ele verifica mudou (filtro por pasta no
# job `changes`). Mudança só de docs roda apenas o Prettier. Em push na `main`,
# e só se o `ci-ok` passar, publica a API no Railway e o front na Vercel — cada
# um só se a sua parte mudou. Secrets, variáveis e regras: docs/deploy.md.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # roda tudo e publica tudo (redeploy manual)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detectar o que mudou
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Mudança em shared ou na infra de build (lockfile, workflow, tsconfig
      # base, versão do Node) afeta os dois apps.
      shared: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.infra == 'true' }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.infra == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
            shared:
              - 'packages/shared/**'
            api:
              - 'apps/api/**'
              - 'railway.json'
            web:
              - 'apps/web/**'

  format:
    name: Formatação (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Sem npm ci: a mesma versão do package-lock, baixada sozinha. Roda
      # sempre, porque docs também seguem o Prettier.
      - run: npx --yes prettier@3.8.4 --check .

  shared:
    name: Shared (type-check e testes)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p packages/shared/tsconfig.json
      - run: npm test --workspace packages/shared

  api:
    name: API (build, type-check e testes unitários)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # o postinstall da API roda `prisma generate`
      - name: Build (shared → api)
        run: npm run build --workspace packages/shared && npm run build --workspace apps/api
      - name: Type-check
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Testes unitários
        run: npm test --workspace apps/api

  api-e2e:
    name: API (testes e2e com Postgres)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beverage
          POSTGRES_PASSWORD: beverage
          POSTGRES_DB: beverage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beverage -d beverage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do próprio job — nunca aponte para o banco da loja.
      DATABASE_URL: postgresql://beverage:beverage@localhost:5432/beverage?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:api

  web:
    name: Web (lint, build, type-check, testes e Lighthouse)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # O build vem antes do type-check: `vite build` gera routeTree.gen.ts
      # (fora do git), que o tsc do web precisa.
      - name: Build
        run: npm run build --workspace apps/web
      - name: Type-check
        run: npm run typecheck --workspace apps/web
      - name: Testes unitários
        run: npm test --workspace apps/web
      # Lighthouse no build de produção servido pelo `vite preview` (que faz o
      # fallback de SPA). Limites e páginas em apps/web/lighthouserc.json.
      - name: Lighthouse
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun
      - name: Relatório do Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: apps/web/lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14

  # Check único para a proteção de branch: verde quando nenhum job falhou
  # (job pulado por não ter mudança conta como ok).
  ci-ok:
    name: CI ok
    needs: [changes, format, shared, api, api-e2e, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::Algum job terminou como $r"; exit 1 ;; esac
          done

  deploy-api:
    name: Deploy da API (Railway)
    needs: [changes, ci-ok]
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global @railway/cli
      # Envia o monorepo; o Railway builda com railway.json → apps/api/Dockerfile,
      # que roda `prisma migrate deploy` antes de subir. `--ci` acompanha o build
      # e falha o job se ele falhar.
      - name: railway up
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"
      # Smoke test: a API respondeu? /auth/me sem token tem que dar 401.
      - name: Smoke test da API
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/auth/me" || true)
            echo "Tentativa $i: HTTP $code"
            [ "$code" = "401" ] && exit 0
            sleep 15
          done
          echo "::error::A API não respondeu 401 em $API_URL/auth/me depois do deploy."
          exit 1

  deploy-web:
    name: Deploy do front (Vercel)
    needs: [changes, ci-ok, deploy-api]
    # Depois da API (quando ela também foi publicada), para o front novo não
    # chegar antes do backend que ele espera.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build do web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Defina a variável VITE_API_URL (URL pública da API no Railway, terminando em /api)."
            exit 1
          fi
          npm run build --workspace apps/web
      # Build feito aqui (o mesmo código que passou nos testes); a Vercel só
      # recebe os arquivos estáticos no formato Build Output API v3. As rotas
      # repetem apps/web/vercel.json: arquivo existente, senão index.html (SPA).
      - name: Montar .vercel/output
        run: |
          mkdir -p .vercel/output
          cp -r apps/web/dist .vercel/output/static
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/assets/(.*)",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          JSON
      - id: deploy
        name: vercel deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado em $url"
